<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>集团模型网关用量管理平台 · MaaS</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style id="styleBase">
:root{
  --primary:#5b6cff; --primary-2:#7c5cff; --primary-soft:#eef0ff;
  --accent:#10b981;
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --bg:#f5f7fb; --surface:#fff; --surface-2:#fafbfd;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --border:#e5e7eb; --border-2:#f1f5f9;
  --shadow:0 1px 3px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.03);
  --shadow-lg:0 10px 25px rgba(15,23,42,.08);
  --radius:10px; --radius-lg:14px;
  --side-w:240px; --top-h:60px;
  --gap:16px; --gap-lg:20px; --gap-xl:24px;
}
[data-theme="dark"]{
  --bg:#0b1222; --surface:#111a2e; --surface-2:#17223b;
  --text:#f1f5f9; --text-2:#a6b3c8; --text-3:#6b7a93;
  --border:#243147; --border-2:#1b2539; --primary-soft:#1e2a52;
  --shadow:0 1px 3px rgba(0,0,0,.35); --shadow-lg:0 10px 25px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
code{font:12px/1.5 Menlo,Consolas,monospace;background:var(--border-2);padding:1px 6px;border-radius:4px}

#app{
  display:grid;
  grid-template-columns:var(--side-w) 1fr;
  grid-template-rows:var(--top-h) 1fr;
  grid-template-areas:"side top" "side main";
  min-height:100vh;
}

/* ============ 顶栏 ============ */
.topbar{
  grid-area:top;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 var(--gap-xl);gap:var(--gap);
  position:sticky;top:0;z-index:10;
  backdrop-filter:saturate(180%) blur(6px);
}
.topbar .page-title{display:flex;flex-direction:column;gap:2px;line-height:1.25}
.topbar .page-title h1{font-size:16px;font-weight:600;letter-spacing:.2px;color:var(--text)}
.topbar .page-title .sub{font-size:12px;color:var(--text-3)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ============ 侧栏 ============ */
.sidebar{
  grid-area:side;background:var(--surface);
  border-right:1px solid var(--border);
  padding:20px 0 16px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden;
}
.sidebar .logo{
  display:flex;align-items:center;gap:12px;
  padding:0 20px 18px;margin-bottom:6px;
  border-bottom:1px solid var(--border-2);
}
.sidebar .logo-mark{
  width:40px;height:40px;flex:0 0 40px;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(91,108,255,.25);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.sidebar .logo-mark svg{display:block;width:100%;height:100%}
.sidebar .logo-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.sidebar .logo-title{
  font-size:15px;font-weight:700;letter-spacing:.4px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 55%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap;
}
.sidebar .logo-sub{
  font-size:11px;color:var(--text-3);font-weight:400;margin-top:1px;
  letter-spacing:.3px;white-space:nowrap;
}
.sidebar .group{
  padding:14px 20px 6px;font-size:10.5px;
  color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
}
.sidebar .navItem{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:0 8px;
  color:var(--text-2);cursor:pointer;
  border-radius:8px;
  font-size:13.5px;font-weight:500;
  transition:background .15s,color .15s;
}
.sidebar .navItem:hover{background:var(--surface-2);color:var(--text)}
.sidebar .navItem.active{
  background:linear-gradient(90deg,var(--primary-soft) 0%,transparent 100%);
  color:var(--primary);font-weight:600;
  box-shadow:inset 3px 0 0 var(--primary);
}
.sidebar .navItem .ico{width:18px;text-align:center;font-size:15px}
.sidebar .side-footer{
  margin-top:auto;padding:12px 20px;
  border-top:1px solid var(--border-2);
  font-size:11px;color:var(--text-3);line-height:1.5;
}

/* ============ 主内容 ============ */
.main{grid-area:main;padding:var(--gap-xl);overflow-x:hidden}
.page-head{margin-bottom:var(--gap-lg)}
.page-head h2{font-size:20px;font-weight:700;letter-spacing:.2px;margin-bottom:4px}
.page-head .desc{font-size:13px;color:var(--text-2)}

/* ============ 响应式 ============ */
@media (max-width:1100px){
  :root{--side-w:72px}
  .sidebar .logo-txt,.sidebar .navItem .label,.sidebar .group,.sidebar .side-footer{display:none}
  .sidebar .logo{justify-content:center;padding:0 0 18px}
  .sidebar nav{padding:8px 6px}
  .sidebar .navItem{justify-content:center;padding:11px 0}
  .sidebar .navItem.active{box-shadow:inset 3px 0 0 var(--primary)}
}
@media (max-width:640px){
  :root{--side-w:0px;--gap-xl:16px}
  .sidebar{display:none}
  #app{grid-template-columns:1fr}
  .topbar{padding:0 14px}
  .topbar .page-title h1{font-size:15px}
}
</style>
<style id="styleComp">
.row{display:flex;gap:var(--gap);flex-wrap:wrap}
.col{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-lg)}
.card-pad{padding:20px}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-hd h3,.card-hd .card-ti{font-size:14.5px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.card-bd{padding:18px 20px}
.text-2{color:var(--text-2)} .text-3{color:var(--text-3)}

/* KPI 卡 */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap);margin-bottom:var(--gap-lg)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.kpi.warn::before{background:linear-gradient(90deg,var(--warning),#fbbf24)}
.kpi.danger::before{background:linear-gradient(90deg,var(--danger),#f87171)}
.kpi .label{color:var(--text-2);font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:500}
.kpi .value{font-size:26px;font-weight:700;margin-bottom:6px;font-family:-apple-system,"Segoe UI",sans-serif;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--text-3)}
.delta.up{color:var(--danger)} .delta.down{color:var(--success)}

/* 图表容器 */
.chart{width:100%;height:320px}
.chart-sm{width:100%;height:260px}

/* 控件 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:#4451d6;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-grp{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.btn-grp button{padding:6px 14px;background:transparent;color:var(--text-2);border:none;cursor:pointer;font-size:13px;border-right:1px solid var(--border);font-weight:500;transition:all .15s}
.btn-grp button:last-child{border-right:none}
.btn-grp button:hover{color:var(--primary)}
.btn-grp button.active{background:var(--primary);color:#fff}
.input,.select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;min-width:140px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,108,255,.12)}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border-2)}
.tbl th{background:var(--surface-2);color:var(--text-2);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;font-size:12px;letter-spacing:.2px}
.tbl th:hover{color:var(--primary)}
.tbl tbody tr{transition:background .12s}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:-apple-system,"Segoe UI",sans-serif}
.tbl .linkRow{color:var(--primary);cursor:pointer;font-weight:500}

/* 面包屑 */
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.crumbs a{color:var(--primary);cursor:pointer;font-weight:500}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--text-3)}

/* 告警徽章 */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
[data-theme="dark"] .badge.ok{background:#064e3b;color:#6ee7b7}
[data-theme="dark"] .badge.warn{background:#78350f;color:#fcd34d}
[data-theme="dark"] .badge.danger{background:#7f1d1d;color:#fca5a5}

/* 工具条 */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:var(--gap-lg);padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar .spacer{flex:1}

/* toast */
.toast{position:fixed;top:20px;right:20px;background:var(--surface);border-left:4px solid var(--success);padding:10px 16px;border-radius:6px;box-shadow:var(--shadow-lg);z-index:999;font-size:13px;animation:slide .3s}
.toast.error{border-left-color:var(--danger)}
@keyframes slide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>

<div id="app"></div>
<script id="mockData">
/* ========== Mock 数据生成器 ========== */
const SERVICE_TYPES = [
  {id:'llm-chat',  name:'LLM 对话',    unit:'千 tokens', price:0.012},
  {id:'llm-embed', name:'向量嵌入',    unit:'千 tokens', price:0.0007},
  {id:'image-gen', name:'图像生成',    unit:'张',        price:0.05},
  {id:'asr',       name:'语音识别',    unit:'分钟',      price:0.06},
  {id:'tts',       name:'语音合成',    unit:'万字符',    price:0.18}
];

const DEPARTMENTS = [
  {id:'jd-retail',   name:'京东零售',   budget:180000, children:[ {id:'jdr-search',name:'搜索推荐部'},{id:'jdr-mall',name:'主站商城部'},{id:'jdr-supply',name:'供应链中台'} ]},
  {id:'jd-tech',     name:'京东科技',   budget:150000, children:[ {id:'jdt-ai',name:'AI 平台部'},{id:'jdt-cloud',name:'京东云事业部'},{id:'jdt-fintech',name:'数字金融部'} ]},
  {id:'jd-logistics',name:'京东物流',   budget:90000,  children:[ {id:'jdl-ops',name:'仓配运营部'},{id:'jdl-route',name:'智能路由部'} ]},
  {id:'jd-health',   name:'京东健康',   budget:60000,  children:[ {id:'jdh-clinic',name:'互联网医院'},{id:'jdh-pharma',name:'医药零售部'} ]},
  {id:'jd-industry', name:'京东工业',   budget:40000,  children:[ {id:'jdi-mro',name:'MRO 工业品事业部'} ]}
];
const BUSINESS_LINES = [
  {id:'bl-search',name:'京东搜索',deptId:'jdr-search'},{id:'bl-recom',name:'商品推荐',deptId:'jdr-search'},
  {id:'bl-mall',name:'主站交易',deptId:'jdr-mall'},{id:'bl-supply',name:'供应链智能',deptId:'jdr-supply'},
  {id:'bl-ai-plat',name:'言犀 AI 平台',deptId:'jdt-ai'},{id:'bl-cloud',name:'京东云服务',deptId:'jdt-cloud'},
  {id:'bl-fintech',name:'数字金融风控',deptId:'jdt-fintech'},{id:'bl-warehouse',name:'智能仓储',deptId:'jdl-ops'},
  {id:'bl-route',name:'路径规划',deptId:'jdl-route'},{id:'bl-clinic',name:'在线问诊',deptId:'jdh-clinic'},
  {id:'bl-pharma',name:'药品零售',deptId:'jdh-pharma'},{id:'bl-mro',name:'工业品采购',deptId:'jdi-mro'}
];

const MODEL_CATALOG = [
  {id:'deepseek-v3',name:'DeepSeek-V3',vendor:'DeepSeek',modality:'text',priceIn:0.002,priceOut:0.008},
  {id:'deepseek-r1',name:'DeepSeek-R1',vendor:'DeepSeek',modality:'text',priceIn:0.004,priceOut:0.016},
  {id:'glm-4-plus',name:'GLM-4-Plus',vendor:'智谱 AI',modality:'text',priceIn:0.005,priceOut:0.005},
  {id:'glm-4v',name:'GLM-4V',vendor:'智谱 AI',modality:'multimodal',priceIn:0.05,priceOut:0.05},
  {id:'kimi-moonshot-v1',name:'Kimi-MoonshotV1',vendor:'月之暗面',modality:'text',priceIn:0.012,priceOut:0.012},
  {id:'kimi-k2',name:'Kimi-K2',vendor:'月之暗面',modality:'text',priceIn:0.004,priceOut:0.016},
  {id:'qwen-max',name:'Qwen-Max',vendor:'阿里通义',modality:'text',priceIn:0.02,priceOut:0.06},
  {id:'doubao-pro',name:'豆包 Pro',vendor:'字节火山',modality:'text',priceIn:0.0008,priceOut:0.002},
  {id:'yanxi-llm',name:'言犀大模型',vendor:'京东科技',modality:'text',priceIn:0.001,priceOut:0.003},
  {id:'bge-m3',name:'BGE-M3 Embedding',vendor:'智源研究院',modality:'embedding',priceIn:0.0005,priceOut:0}
];
function getModel(id){ return MODEL_CATALOG.find(m=>m.id===id); }

// 产品树（用于产品层级下钻）
const PRODUCT_TREE = {
  'BG-技术': { name: '技术中台', children: { 'AI平台': { name: 'AI平台', children: { '大模型服务': { name: '大模型服务', children: { 'LLM推理': { name: 'LLM推理', children: { '标准版': { name: '标准版' } } }, 'Embedding': { name: 'Embedding', children: { '稠密向量': { name: '稠密向量' } } } } }, '视觉智能': { name: '视觉智能', children: { '图像生成': { name: '图像生成' } } } } }, '云原生': { name: '云原生', children: { '容器服务': { name: '容器服务', children: { 'ACK集群': { name: 'ACK集群' } } } } } } },
  'BG-零售': { name: '零售技术', children: { '搜索推荐': { name: '搜索推荐', children: { '电商搜索': { name: '电商搜索', children: { '语义检索': { name: '语义检索' } } }, '个性化推荐': { name: '个性化推荐', children: { '猜你喜欢': { name: '猜你喜欢' } } } } }, '供应链': { name: '供应链', children: { '库存预测': { name: '库存预测', children: { '销量预测': { name: '销量预测' } } } } } } },
  'BG-物流': { name: '物流科技', children: { '智能调度': { name: '智能调度', children: { '路径规划': { name: '路径规划', children: { '实时路径': { name: '实时路径' } } } } } } }
};
function flattenProductTree(node, path = []) { let items = []; const currentName = node.name; const currentPath = [...path, currentName]; items.push({ path: currentPath, level: currentPath.length - 1, name: currentName }); if (node.children) { for (const key in node.children) { items.push(...flattenProductTree(node.children[key], currentPath)); } } return items; }
const ALL_PRODUCT_PATHS = []; for (const bgKey in PRODUCT_TREE) { const bgNode = { name: bgKey, children: PRODUCT_TREE[bgKey].children }; ALL_PRODUCT_PATHS.push(...flattenProductTree(bgNode, [])); }

const APP_PREFIXES = ['智能','AI','一键','自动','极速','灵犀','慧眼','妙笔','千问','启明'];
const APP_SUFFIXES = ['助手','引擎','分析','报表','客服','摘要','搜索','问答','审核','翻译'];
function generateApps(){
  const apps = []; let counter = 1000;
  BUSINESS_LINES.forEach(bl=>{
    const n = 3 + Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){
      const productPath = ALL_PRODUCT_PATHS[Math.floor(Math.random() * ALL_PRODUCT_PATHS.length)];
      apps.push({ id:'app-'+(counter++), name: APP_PREFIXES[Math.floor(Math.random()*APP_PREFIXES.length)] + APP_SUFFIXES[Math.floor(Math.random()*APP_SUFFIXES.length)], blId: bl.id, deptId: bl.deptId, owner: ['张磊','王芳','李娜','刘强','陈静','赵宇'][Math.floor(Math.random()*6)], serviceType: SERVICE_TYPES[Math.floor(Math.random()*SERVICE_TYPES.length)].id, productPath: productPath.path });
    }
  });
  return apps;
}
const APPS = generateApps();

function pickRandom(arr, n){ const copy = arr.slice(); const out = []; for(let i=0;i<n && copy.length;i++){ out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); } return out; }
function genAppModelUsage(days){
  const map = {}; const now = new Date(); now.setHours(0,0,0,0);
  APPS.forEach(app=>{
    const modelCount = 2 + Math.floor(Math.random()*3);
    const models = pickRandom(MODEL_CATALOG, modelCount);
    map[app.id] = models.map(m=>{
      const isEmbed = m.modality === 'embedding';
      const baseCalls = 800 + Math.floor(Math.random()*8000);
      const dailyPoints = [];
      let sumCalls=0, sumTokensIn=0, sumTokensOut=0, sumCost=0;
      for(let i=days-1;i>=0;i--){
        const d = new Date(now.getTime() - i*86400000);
        const isWeekend = d.getDay()===0||d.getDay()===6;
        const factor = isWeekend ? 0.45 : 1.0;
        const noise = 0.7 + Math.random()*0.6;
        const calls = Math.max(1, Math.round(baseCalls * factor * noise / days * 2));
        const tokensIn  = calls * (isEmbed ? (200 + Math.random()*400) : (300 + Math.random()*700));
        const tokensOut = isEmbed ? 0 : calls * (150 + Math.random()*500);
        const cost = +((tokensIn/1000)*m.priceIn + (tokensOut/1000)*m.priceOut).toFixed(2);
        dailyPoints.push({ date: d.toISOString().slice(0,10), calls, tokensIn: Math.round(tokensIn), tokensOut: Math.round(tokensOut), cost });
        sumCalls+=calls; sumTokensIn+=tokensIn; sumTokensOut+=tokensOut; sumCost+=cost;
      }
      return { modelId:m.id, modelName:m.name, vendor:m.vendor, modality:m.modality, priceIn:m.priceIn, priceOut:m.priceOut, calls:sumCalls, tokensIn:Math.round(sumTokensIn), tokensOut:Math.round(sumTokensOut), tokensTotal:Math.round(sumTokensIn+sumTokensOut), cost:+sumCost.toFixed(2), dailyPoints };
    });
  });
  return map;
}
const APP_MODEL_USAGE = genAppModelUsage(30);

function getAppModelDailyMerged(appId){ const models = APP_MODEL_USAGE[appId]||[]; const byDate={}; models.forEach(m=>{ m.dailyPoints.forEach(p=>{ if(!byDate[p.date]) byDate[p.date]={date:p.date,calls:0,cost:0}; byDate[p.date].calls+=p.calls; byDate[p.date].cost+=p.cost; }); }); return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date)); }

function kpiCard(label, value, delta, deltaLabel, cls, badge){ const el = h('div',{class:'kpi '+(cls||'')}, h('div',{class:'label'}, label), h('div',{class:'value'}, value)); if(delta!=null){ const up = delta >= 0; el.appendChild(h('div',{class:'delta '+(up?'up':'down')}, (up?'▲ ':'▼ ') + (Math.abs(delta)*100).toFixed(1)+'% ' + (deltaLabel||''))); } else if(badge){ el.appendChild(h('div',{class:'delta'}, h('span',{class:'badge '+(cls==='danger'?'danger':cls==='warn'?'warn':'ok')}, badge))); } return el; }
</script>

<script id="pageApiKey">
// API Key 多维下钻（ID维度）
let ApiKeySORT = {key:'cost', dir:'desc'};
function renderApiKeyDrill(root){
  const {apiKeyId} = STATE.drill;
  if(apiKeyId){
    const apiKey = API_KEYS.find(k => k.id === apiKeyId);
    if(apiKey){
      const modelRows = getApiKeyModels(apiKeyId);
      const dailyPoints = getApiKeyDailyMerged(apiKeyId);
      renderUnifiedModelDetail(root, `ID: ${apiKey.key}`, modelRows, dailyPoints, ()=>{ STATE.drill={type:'apikey', apiKeyId:null}; render(); });
    } else { root.appendChild(h('div',{class:'card card-pad'}, '未找到该ID')); }
  } else {
    root.appendChild(renderApiKeyToolbar());
    const tableCard = h('div',{class:'card'}, h('div',{id:'apiKeyTableHost'}));
    root.appendChild(tableCard);
    renderApiKeyTable();
  }
}
function renderApiKeyToolbar(){
  const vendors = [...new Set(MODEL_CATALOG.map(m=>m.vendor))];
  const selectedVendor = STATE.apiKeyFilter.vendor;
  let availableModels = MODEL_CATALOG;
  if(selectedVendor) availableModels = MODEL_CATALOG.filter(m=>m.vendor === selectedVendor);
  const modelOptions = [...new Map(availableModels.map(m=>[m.name, m.name])).keys()];
  const sourceOptions = ['', ...SOURCE_OPTIONS];
  return h('div',{class:'toolbar'},
    h('input',{class:'input', placeholder:'🔍 搜索ID', value:STATE.apiKeyFilter.keyword, onInput:e=>{STATE.apiKeyFilter.keyword=e.target.value; render();}}),
    h('select',{class:'select', value:STATE.apiKeyFilter.source, onChange:e=>{STATE.apiKeyFilter.source=e.target.value; render();}}, 
        sourceOptions.map(src => h('option',{value:src}, src === '' ? '全部来源' : src))),
    h('select',{class:'select', value:STATE.apiKeyFilter.vendor, onChange:e=>{STATE.apiKeyFilter.vendor=e.target.value; STATE.apiKeyFilter.modelName=''; render();}}, h('option',{value:''},'全部厂商'), ...vendors.map(v=>h('option',{value:v},v))),
    h('select',{class:'select', value:STATE.apiKeyFilter.modelName, onChange:e=>{STATE.apiKeyFilter.modelName=e.target.value; render();}}, h('option',{value:''},'全部模型'), ...modelOptions.map(m=>h('option',{value:m},m))),
    h('div',{class:'spacer'}),
    h('button',{class:'btn sm', onClick:exportApiKeyCSV},'⬇ 导出 CSV'),
    h('button',{class:'btn sm primary', onClick:exportApiKeyExcel},'⬇ 导出 Excel')
  );
}
function getFilteredApiKeys(){
  let keys = [...API_KEYS];
  // 按费用排序（保持顺序）
  keys.sort((a,b)=>b.cost - a.cost);
  // 搜索ID
  const keyword = STATE.apiKeyFilter.keyword.trim().toLowerCase();
  if(keyword) keys = keys.filter(k => k.key.toLowerCase().includes(keyword));
  // 来源方筛选
  if(STATE.apiKeyFilter.source) keys = keys.filter(k => k.source === STATE.apiKeyFilter.source);
  // 厂商/模型筛选
  const vendor = STATE.apiKeyFilter.vendor;
  const modelName = STATE.apiKeyFilter.modelName;
  if(vendor || modelName){
    keys = keys.filter(k => {
      const models = getApiKeyModels(k.id);
      return models.some(m => {
        if(vendor && m.vendor !== vendor) return false;
        if(modelName && !m.modelName.toLowerCase().includes(modelName.toLowerCase())) return false;
        return true;
      });
    });
  }
  keys.sort((a,b)=>{ const va = a[ApiKeySORT.key], vb = b[ApiKeySORT.key]; if(typeof va==='number') return ApiKeySORT.dir==='asc'?va-vb:vb-va; return ApiKeySORT.dir==='asc'? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va)); });
  return keys;
}
function renderApiKeyTable(){
  const host = document.getElementById('apiKeyTableHost');
  if(!host) return;
  host.innerHTML = '';
  const rows = getFilteredApiKeys();
  const thConf = [['key','ID'], ['source','数据来源方'], ['modelCount','模型数'], ['usage','用量(tokens)'], ['cost','费用(元)']];
  const thead = h('thead',{}, h('tr',{}, ...thConf.map(([k,label])=> h('th',{onClick:()=>{ ApiKeySORT.dir = ApiKeySORT.key===k && ApiKeySORT.dir==='desc' ? 'asc' : 'desc'; ApiKeySORT.key = k; renderApiKeyTable(); }}, label + (ApiKeySORT.key===k?(ApiKeySORT.dir==='desc'?' ▼':' ▲'):'')))));
  const tbody = h('tbody',{});
  if(rows.length===0) tbody.appendChild(h('tr',{}, h('td',{colspan:thConf.length, style:'text-align:center;padding:40px;color:var(--text-3)'},'暂无数据')));
  rows.forEach(r=>{
    const tr = h('tr',{});
    thConf.forEach(([k])=>{
      let val = r[k];
      let cls='';
      if(k==='key'){
        tr.appendChild(h('td',{class:'linkRow', onClick:()=>{ STATE.drill={type:'apikey', apiKeyId:r.id}; render(); }}, val));
        return;
      }
      if(['usage','cost','modelCount'].includes(k)){ cls='num'; val = k==='cost' ? fmtMoney(val) : fmtNum(val); }
      tr.appendChild(h('td',{class:cls}, val??'-'));
    });
    tbody.appendChild(tr);
  });
  const footer = h('div',{class:'card-bd text-3', style:'padding:10px 20px;border-top:1px solid var(--border-2);font-size:12px'}, `共 ${rows.length} 条 · 点击表头排序 · 点击ID查看模型明细`);
  host.appendChild(h('table',{class:'tbl'}, thead, tbody));
  host.appendChild(footer);
}
function exportApiKeyCSV(){
  const rows = getFilteredApiKeys();
  if(rows.length===0){ toast('无数据可导出','error'); return; }
  const headers = ['key','source','modelCount','usage','cost'];
  const lines = [headers.join(',')];
  rows.forEach(r=> lines.push(headers.map(k=> r[k]).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `maas-ids-${Date.now()}.csv`; a.click(); toast('CSV 导出成功');
}
function exportApiKeyExcel(){
  const rows = getFilteredApiKeys();
  if(rows.length===0){ toast('无数据可导出','error'); return; }
  const headers = ['key','source','modelCount','usage','cost'];
  const html = `<meta charset="utf-8"><table border="1">${headers.map(h=>`<th>${h}</th>`).join('')}${rows.map(r=>`<tr>${headers.map(h=>`<td>${r[h]}</td>`).join('')}</tr>`).join('')}</table>`;
  const blob = new Blob([html], {type:'application/vnd.ms-excel'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `maas-ids-${Date.now()}.xls`; a.click(); toast('Excel 导出成功');
}
</script>
